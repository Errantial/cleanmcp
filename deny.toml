# cargo-deny configuration: licenses, security advisories, duplicate/ban rules.
# Run locally with: cargo deny check

[graph]
all-features = true

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
]
confidence-threshold = 0.8

[advisories]
# No unmaintained/vulnerable crates in the dependency graph.
yanked = "deny"
unmaintained = "warn"

[bans]
multiple-versions = "warn"
wildcards = "allow"
