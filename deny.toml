# cargo-deny configuration: licenses, security advisories, duplicate/ban rules.
# Run locally with: cargo deny check

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
]
confidence-threshold = 0.8

[advisories]
ignore = [
    # paste is unmaintained but stable and tiny (transitive dep of windows-sys);
    # no known vulnerability. Re-evaluate on dependency updates.
    { id = "RUSTSEC-2024-0436", reason = "unmaintained but stable, no vulnerability" },
]

[bans]
multiple-versions = "warn"
wildcards = "allow"
