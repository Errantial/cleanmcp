[workspace]
resolver = "3"
members = ["crates/cleanmcp-core", "crates/cleanmcp"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
cleanmcp-core = { path = "crates/cleanmcp-core" }
anyhow = "1.0"
bytesize = "2.7"
clap = { version = "4.6", features = ["derive"] }
rayon = "1.12"
rmcp = { version = "3.8", features = ["server", "transport-io", "macros", "transport-streamable-http-server"] }
schemars = "1.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "io-std", "net", "time", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
