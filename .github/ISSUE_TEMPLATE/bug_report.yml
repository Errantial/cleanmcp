name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please fill in every field — "it doesn't work" is hard to act on.
  - type: input
    id: version
    attributes:
      label: cleanmcp version
      description: Output of `cleanmcp --version`
      placeholder: cleanmcp 1.0.0
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11 24H2, Ubuntu 24.04, macOS 15.1, ...
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command you ran
      description: The exact command line (feel free to redact paths)
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead
      description: Include the output, or `--json` output if relevant. A `cleanmcp snapshot -o snap.jsonl.gz PATH` of the folder helps for scan discrepancies.
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Config file contents (redacted), whether the folder is on a network drive / OneDrive / external disk, antivirus, etc.
