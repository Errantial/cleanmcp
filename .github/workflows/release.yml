name: Release

on:
  push:
    tags: ["v*"]
  # Nightly: build every target from main and upload to the "nightly" pre-release.
  schedule:
    - cron: "0 3 * * *"
  # Manual runs build and upload artifacts without publishing a release.
  workflow_dispatch:

# Read-only by default; only the publish job may create releases / attest.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        run: cargo build --release --locked -p cleanmcp --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then VERSION="${GITHUB_REF_NAME#v}"; else VERSION="dev-${GITHUB_SHA::7}"; fi
          NAME="cleanmcp-$VERSION-${{ matrix.target }}"
          EXE=""; [[ "${{ matrix.target }}" == *windows* ]] && EXE=".exe"
          BIN="target/${{ matrix.target }}/release/cleanmcp$EXE"
          "$BIN" --version
          mkdir -p "dist/$NAME/completions"
          cp "$BIN" README.md LICENSE-MIT LICENSE-APACHE "dist/$NAME/"
          cp docs/mcp-setup.md "dist/$NAME/MCP-SETUP.md"
          "$BIN" completions bash > "dist/$NAME/completions/cleanmcp.bash"
          "$BIN" completions zsh > "dist/$NAME/completions/_cleanmcp"
          "$BIN" completions fish > "dist/$NAME/completions/cleanmcp.fish"
          "$BIN" completions powershell > "dist/$NAME/completions/_cleanmcp.ps1"
          "$BIN" man > "dist/$NAME/cleanmcp.1"
          cd dist
          if [[ -n "$EXE" ]]; then 7z a -tzip "$NAME.zip" "$NAME" > /dev/null; else tar -czf "$NAME.tar.gz" "$NAME"; fi
          rm -rf "$NAME"
          ls -l
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write   # artifact attestations
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums and release notes
        run: |
          cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS && cd ..
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            # The section of CHANGELOG.md whose heading is exactly "## <version> ...".
            awk -v v="$VERSION" '/^## /{f = ($2 == v); next} f' CHANGELOG.md > notes.md
            if ! grep -q '[^[:space:]]' notes.md; then echo "::error::CHANGELOG.md has no section for $VERSION"; exit 1; fi
          else
            echo "Nightly build from main at ${GITHUB_SHA}. Not a stable release." > notes.md
          fi
          cat notes.md
      - name: SBOM
        uses: anchore/sbom-action@v0
        with:
          path: dist
          artifact-name: sbom
          output-file: sbom.spdx.json
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'dist/*'
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            gh release create "$GITHUB_REF_NAME" dist/* sbom.spdx.json --repo "$GITHUB_REPOSITORY" --title "cleanmcp $GITHUB_REF_NAME" --notes-file notes.md
          else
            # Nightly: one rolling pre-release, artifacts clobbered each run.
            if gh release view nightly --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release upload nightly dist/* sbom.spdx.json --repo "$GITHUB_REPOSITORY" --clobber
              gh release edit nightly --repo "$GITHUB_REPOSITORY" --notes-file notes.md
            else
              gh release create nightly dist/* sbom.spdx.json --repo "$GITHUB_REPOSITORY" --title "cleanmcp nightly" --prerelease --notes-file notes.md
            fi
          fi
