[package]
name = "cleanmcp"
description = "TreeSize-style disk usage CLI with a built-in MCP server for AI agents"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "cleanmcp"
path = "src/main.rs"

[dependencies]
cleanmcp-core.workspace = true
anyhow.workspace = true
bytesize.workspace = true
clap.workspace = true
rmcp.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
ratatui = "0.29.0"
trash = "5.2.9"
compact_str = "0.10.0"
axum = { version = "0.8.9", default-features = false, features = ["tokio", "http1"] }
tokio-util = "0.7.20"
clap_complete = "4.6.11"
clap_mangen = "0.3.3"

[dev-dependencies]
rmcp = { workspace = true, features = ["client", "transport-child-process"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["process", "macros", "rt-multi-thread"] }
