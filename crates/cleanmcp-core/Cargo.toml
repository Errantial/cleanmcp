[package]
name = "cleanmcp-core"
description = "Disk usage scanning and cleanup analysis used by the cleanmcp CLI and MCP server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
rayon.workspace = true
serde.workspace = true
schemars.workspace = true
globset = "0.4.19"
dunce = "1.0.5"
compact_str = "0.10.0"

[dev-dependencies]
tempfile.workspace = true

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Security", "Win32_System_IO"] }
