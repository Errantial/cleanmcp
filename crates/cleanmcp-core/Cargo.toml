[package]
name = "cleanmcp-core"
description = "Disk usage scanning and cleanup analysis used by the cleanmcp CLI and MCP server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
rayon.workspace = true
serde.workspace = true
schemars.workspace = true
globset = "0.4.19"
ignore = "0.4.34"
dunce = "1.0.5"
compact_str = { version = "0.10.0", features = ["serde"] }
blake3 = "1.8.7"
toml = "1.1.8"
dirs = "7.0.0"
flate2 = "1.1.10"
serde_json.workspace = true
sysinfo = { version = "0.36.1", default-features = false, features = ["disk"] }

[dev-dependencies]
tempfile.workspace = true

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Security", "Win32_System_IO"] }
